name: Deploy GitHub Pages

on:
  push:
    branches:
      - Live
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase
        run: node scripts/configure-firebase.mjs
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          GOOGLE_DRIVE_WEB_APP_URL: ${{ vars.GOOGLE_DRIVE_WEB_APP_URL }}

      - name: Build Angular app
        run: npm run build

      - name: Prepare static site
        run: |
          cp dist/xevenst-github/browser/homepage/index.html dist/xevenst-github/browser/index.html
          touch dist/xevenst-github/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/xevenst-github/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
