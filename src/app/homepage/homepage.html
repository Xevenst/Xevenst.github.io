<main class="welcome-screen">
  <div class="welcome-copy">
    <p class="welcome-label">A little corner of the internet</p>
    <h1 aria-label="Steven Jonathan">
      @for (letter of nameLetters; track letter.index) {
        <span
          class="name-letter"
          [class.name-space]="letter.isSpace"
          [style.--letter-index]="letter.index"
          aria-hidden="true"
        >{{ letter.character }}</span>
      }
    </h1>
    <p class="welcome-message">Welcome. Stay a while.</p>
  </div>
</main>
