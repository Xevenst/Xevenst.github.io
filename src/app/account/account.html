<div class="account-page page-shell">
  <header class="account-header">
    <p class="eyebrow"><span class="eyebrow-line"></span> Account</p>
    <button type="button" class="signout" (click)="signOut()">Sign out ↗</button>
  </header>
  <ng-container *ngIf="user$ | async as user">
    <section class="profile-card"><div class="profile-avatar">{{ (user.displayName || user.email || 'X').charAt(0).toUpperCase() }}</div><div><p class="card-kicker">Signed in as</p><h2>{{ user.displayName || 'Xevenst member' }}</h2><p>{{ user.email }}</p></div><span *ngIf="role$ | async as role" class="member-badge" [class.admin-badge]="!role.loading && role.isAdmin">{{ role.loading ? 'Checking access…' : role.isAdmin ? 'Administrator' : 'Member' }}</span></section>
  </ng-container>
</div>
